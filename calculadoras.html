<meta charset="utf-8">
<script>
/* Agion — guard de sessão: só abre para quem está logado na plataforma */
(function(){try{document.documentElement.style.visibility='hidden';}catch(e){}})();
(function(){
  function show(){try{document.documentElement.style.visibility='';}catch(e){}}
  function deny(){try{location.replace('/plataforma');}catch(e){location.href='/plataforma';}}
  try{
    var ok=false;
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k && k.indexOf('sb-')===0 && k.indexOf('auth-token')>-1){
        var v=null; try{v=JSON.parse(localStorage.getItem(k));}catch(_){}
        if(v && (v.refresh_token || v.access_token || (v.currentSession&&(v.currentSession.refresh_token||v.currentSession.access_token)))){ ok=true; break; }
      }
    }
    ok ? show() : deny();
  }catch(e){ deny(); }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agion · Calculadoras</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b2a26;--goldd:#a6853f;--goldl:#e8cc8b;--line:#e7dec9;--bg:#fbfaf6;--mut:#6e8078}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);font-family:'Poppins',system-ui,sans-serif;display:flex;flex-direction:column}
.bar{background:var(--ink);color:#fff;padding:10px 14px 0;position:sticky;top:0;z-index:5}
.bt{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bt .bn{font-family:'Lora',serif;font-weight:700;font-size:15px}
.bt .bs{font-size:9.5px;letter-spacing:.16em;color:var(--goldl)}
.tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;border:none;background:transparent;color:#cfe0da;padding:9px 14px;border-radius:10px 10px 0 0;cursor:pointer;font-size:13.5px;font-weight:500;font-family:inherit;border-bottom:3px solid transparent}
.tab.on{background:var(--bg);color:var(--ink);border-bottom-color:var(--bg);font-weight:600}
.stage{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
iframe.on{display:block}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px}
</style>

<div class="bar">
 <div class="bt">
  <svg width="26" height="26" viewBox="0 0 100 100"><text x="50" y="66" font-family="Lora,serif" font-size="52" font-weight="700" text-anchor="middle" fill="#e8cc8b">AG</text></svg>
  <div><div class="bn">Agion · Calculadoras</div><div class="bs">FERRAMENTAS DE SIMULAÇÃO</div></div>
 </div>
 <div class="tabs">
  <button class="tab on" data-f="/calc-financiamento">Financiamento × Consórcio</button>
  <button class="tab" data-f="/escada-financeira">Alavancagem financeira</button>
  <button class="tab" data-f="/calc-alavancagem">Alavancagem patrimonial</button>
 </div>
</div>
<div class="stage" id="stage">
 <div class="load" id="load">Carregando…</div>
</div>

<script>
const stage=document.getElementById('stage'), load=document.getElementById('load');
const frames={};
function open(url){
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.f===url));
 Object.values(frames).forEach(f=>f.classList.remove('on'));
 if(!frames[url]){
   const f=document.createElement('iframe'); f.src=url; frames[url]=f; stage.appendChild(f);
   f.addEventListener('load',()=>{load.style.display='none';});
 }
 frames[url].classList.add('on');
 load.style.display = frames[url].dataset.loaded ? 'none':'flex';
 frames[url].addEventListener('load',()=>{frames[url].dataset.loaded=1;load.style.display='none';},{once:true});
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>open(t.dataset.f));
open('/calc-financiamento');
</script>
